<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Painel Administrativo - Samba de Férias</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
  authDomain: "sistemaingressos-a98f0.firebaseapp.com",
  projectId: "sistemaingressos-a98f0",
  storageBucket: "sistemaingressos-a98f0.firebasestorage.app",
  messagingSenderId: "1227812590",
  appId: "1:1227812590:web:07107c0e3069fe9dfbcdff",
  measurementId: "G-QGDNMN0VQ5"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
</script>

<style>
    body {
        font-family: "Poppins", Arial, sans-serif;
        margin: 0;
        background: #f4f7fb;
    }

    header {
        background: linear-gradient(135deg, #0d47a1, #1565c0);
        color: white;
        padding: 18px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .container {
        max-width: 1100px;
        margin: 30px auto;
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.15);
    }

    h2 {
        text-align: center;
        color: #0d47a1;
        margin: 0 0 15px;
    }

    #searchBox {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #bbb;
        font-size: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th {
        background: #1565c0;
        color: white;
        padding: 12px;
        font-weight: 600;
    }

    td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        font-size: 14px;
    }

    tr:hover {
        background: #f1f6ff;
    }

    .btnLogout {
        background: #c62828;
        padding: 10px 18px;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        float: right;
        margin-top: -48px;
        font-size: 14px;
        font-weight: 600;
    }

    .btnLogout:hover {
        background: #b71c1c;
    }

</style>
</head>

<body>

<header>
    Painel Administrativo
    <button class="btnLogout" onclick="logout()">Sair</button>
</header>

<div class="container">
    <h2>Ingressos Gerados</h2>

    <input type="text" id="searchBox" placeholder="Pesquisar por ID do ingresso..." />

    <table>
        <thead>
            <tr>
                <th>ID Ingresso</th>
                <th>Nome</th>
                <th>Evento</th>
                <th>Status Envio</th>
                <th>Status Pagamento</th>
                <th>Gerado em</th>
                <th>Vendedor</th>
            </tr>
        </thead>
        <tbody id="tabelaIngressos">
            <tr><td colspan="7" style="text-align:center;">Carregando...</td></tr>
        </tbody>
    </table>
</div>

<script>
// Verifica se o usuário é admin
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const email = user.email;

    if (!email.endsWith("@admin.com")) {
        alert("Acesso negado! Apenas administradores podem acessar.");
        window.location.href = "controle.html";
        return;
    }

    carregarIngressos();
});

// Carregar ingressos em tempo real
function carregarIngressos() {
    const tabela = document.getElementById("tabelaIngressos");

    db.collection("ingressos").orderBy("geradoEm", "desc").onSnapshot(snapshot => {
        tabela.innerHTML = "";

        if (snapshot.empty) {
            tabela.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Nenhum ingresso encontrado</td></tr>";
            return;
        }

        snapshot.forEach(doc => {
            const ing = doc.data();

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${ing.id ?? ""}</td>
                <td>${ing.nome ?? ""}</td>
                <td>${ing.evento ?? ""}</td>
                <td>${ing.statusEnvio ?? ""}</td>
                <td>${ing.statusPagamento ?? ""}</td>
                <td>${ing.geradoEm?.toDate().toLocaleString("pt-BR")}</td>
                <td>${ing.vendedor ?? ""}</td>
            `;

            tabela.appendChild(tr);
        });
    });
}

// 🔎 Filtro de pesquisa por ID
document.getElementById("searchBox").addEventListener("input", function () {
    const termo = this.value.toLowerCase();
    const linhas = document.querySelectorAll("#tabelaIngressos tr");

    linhas.forEach(linha => {
        const id = linha.children[0]?.textContent.toLowerCase() || "";
        linha.style.display = id.includes(termo) ? "" : "none";
    });
});

// Sair
function logout() {
    auth.signOut();
    window.location.href = "login.html";
}
</script>

</body>
</html>
