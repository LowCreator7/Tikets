<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Ingresso</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- Biblioteca do QRCode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 250px;
      height: 250px;
      margin: auto;
      background: #000;
    }

    #resultado {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body playsinline webkit-playsinline>

  <h2>Validador de Ingressos</h2>

  <div id="reader"></div>
  <div id="resultado"></div>

  <button onclick="window.location.href='index.html'">Voltar</button>

  <script>
    /* --------------------🔥 CONFIG FIREBASE -------------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
      authDomain: "sistemaingressos-a98f0.firebaseapp.com",
      projectId: "sistemaingressos-a98f0",
      storageBucket: "sistemaingressos-a98f0.appspot.com",
      messagingSenderId: "1227812590",
      appId: "1:1227812590:web:07107c0e3069fe9dfbcdff"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    /* ----------------------------------------------------------- */


    /* ------------ FUNÇÃO APÓS LER O QR CODE -------------------- */
    async function onScanSuccess(idLido) {
      const resultado = document.getElementById("resultado");

      try {
        const ref = db.collection("ingressos").doc(idLido.trim());
        const doc = await ref.get();

        if (!doc.exists) {
          resultado.style.color = "red";
          resultado.innerHTML = "❌ Ingresso inválido";
          return;
        }

        const data = doc.data();

        if (data.status === "usado") {
          resultado.style.color = "orange";
          resultado.innerHTML =
            "⚠️ Ingresso já utilizado<br><small>" +
            (data.usadoEm?.toDate ? data.usadoEm.toDate().toLocaleString() : "") +
            "</small>";
          return;
        }

        // Marca como usado
        await ref.update({
          status: "usado",
          usadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });

        resultado.style.color = "green";
        resultado.innerHTML = "✔️ Ingresso validado com sucesso!";

      } catch (e) {
        resultado.style.color = "red";
        resultado.innerHTML = "Erro: " + e.message;
      }
    }

    function onScanError(error) {
      console.warn("Erro scan:", error);
    }


    /* ----------- FUNÇÃO PARA IDENTIFICAR CÂMERA ---------------- */
    async function iniciarScanner() {
      const resultado = document.getElementById("resultado");

      try {
        const devices = await Html5Qrcode.getCameras();

        if (!devices || devices.length === 0) {
          resultado.textContent = "Nenhuma câmera encontrada";
          resultado.style.color = "red";
          return;
        }

        // Prioriza câmera traseira
        let cameraId = devices.find(d =>
          d.label.toLowerCase().includes("back") ||
          d.label.toLowerCase().includes("rear") ||
          d.label.toLowerCase().includes("traseira")
        )?.id;

        if (!cameraId) cameraId = devices[0].id;

        const scanner = new Html5Qrcode("reader");

        await scanner.start(
          cameraId,
          { fps: 10, qrbox: 250 },
          onScanSuccess,
          onScanError
        );

      } catch (err) {
        console.error(err);
        resultado.textContent =
          "⚠️ Não foi possível acessar a câmera. Verifique permissões.";
        resultado.style.color = "red";
      }
    }

    iniciarScanner();
  </script>

</body>
</html>
