<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>

<title>Validador - Samba de Férias</title>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
// 🔥 Configuração do Firebase
const firebaseConfig = {
  apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
  authDomain: "sistemaingressos-a98f0.firebaseapp.com",
  projectId: "sistemaingressos-a98f0",
  storageBucket: "sistemaingressos-a98f0.firebasestorage.app",

  appId: "1:1227812590:web:07107c0e3069fe9dfbcdff",

<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body playsinline webkit-playsinline 
      style="font-family:Arial,Helvetica,sans-serif; padding:20px; text-align:center; background:#f4f7fb; color:#0d47a1;">

  <h2>Validador de Ingressos</h2>
  <p>Aponte a câmera para o QR Code</p>

  <div id="camera"
       allow="camera; autoplay; fullscreen; encrypted-media; clipboard-read; clipboard-write"
       style="max-width:420px;margin:12px auto;">
  </div>

  <div id="status" style="margin-top:12px;font-weight:bold;"></div>

  <a href="index.html" style="display:block;margin-top:12px;color:#1565c0;">⬅ Voltar</a>

<script>
function whenReady(fn){ if(window.db) return fn(); setTimeout(()=>whenReady(fn),150); }

whenReady(() => {
  const status = document.getElementById('status');
  const scanner = new Html5Qrcode("camera");

  async function iniciarScanner() {
    try {
      await scanner.start(
        { facingMode: { exact: "environment" } },
        { fps: 10, qrbox: 250 },
        onScan
      );
    } catch (err1) {
      console.warn("Falhou traseira:", err1);

      try {
        const devices = await Html5Qrcode.getCameras();
        await scanner.start(
          devices[0].id,
          { fps: 10, qrbox: 250 },
          onScan
        );
      } catch (err2) {
        console.error("Erro geral:", err2);
        status.textContent = "⚠️ O iPhone bloqueou a câmera. Verifique permissões.";
        status.style.color = "red";
      }
    }
  }

  function onScan(decodedText){
    validar(decodedText.trim());
  }

  async function validar(id){
    try {
      const ref = db.collection("ingressos").doc(id);
      const doc = await ref.get();

      if(!doc.exists){
        status.textContent = "❌ Ingresso inválido";
        status.style.color = "red";
        return;
      }

      const data = doc.data();

      if(data.status === "usado"){
        status.textContent = "⚠️ Já utilizado";
        status.style.color = "orange";
        return;
      }

      await ref.update({
        status: "usado",
        usadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

      status.textContent = "✔️ Validado com sucesso";
      status.style.color = "green";
    } catch(e){
      status.textContent = "Erro: " + e.message;
      status.style.color = "red";
    }
  }

  iniciarScanner();
});
</script>

</body>
</html>
