<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Ingresso</title>

  <!-- Biblioteca do QRCode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 350px;
      margin: auto;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body playsinline webkit-playsinline>

  <h2>Validador de Ingressos</h2>

  <div id="reader"></div>
  <div id="resultado"></div>

  <button onclick="window.location.href='index.html'">Voltar</button>

  <script>
    function onScanSuccess(decodedText) {
      document.getElementById("resultado").innerHTML =
        "🎫 Ingresso encontrado:<br>" + decodedText;

      // Aqui depois você pode consultar o Firebase se quiser
    }

    function onScanError(error) {
      console.warn(error);
    }

    // Inicializa o scanner
    document.addEventListener("DOMContentLoaded", () => {
      const html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };

      // Tenta câmera traseira — se falhar, tenta qualquer câmera
      Html5Qrcode.getCameras().then(devices => {
        if (devices.length === 1) {
          alert("Nenhuma câmera encontrada.");
          return;
        }

        let cameraId = devices[0].id;

        // Procura câmera traseira
        devices.forEach(d => {
          if (d.label.toLowerCase().includes("back")) cameraId = d.id;
        });

        html5QrCode.start(
          cameraId,
          config,
          onScanSuccess,
          onScanError
        );
      }).catch(err => {
        console.error(err);
        alert("Erro ao acessar a câmera.");
      });
    });
  </script>
</body>
</html>
