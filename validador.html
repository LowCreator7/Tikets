<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Ingresso</title>

  <!-- Biblioteca do QRCode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 350px;
      height: 350px; /* Importante para iPhone */
      margin: auto;
      background: #000;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body playsinline webkit-playsinline>

  <h2>Validador de Ingressos</h2>

  <div id="reader"></div>
  <div id="resultado"></div>

  <button onclick="window.location.href='index.html'">Voltar</button>

  <script>
    // Função chamada quando o QR Code é lido
    function onScanSuccess(decodedText) {
      document.getElementById("resultado").innerHTML =
        "🎫 Ingresso encontrado:<br>" + decodedText;
    }

    // Caso o QR não seja lido
    function onScanError(error) {
      console.warn(error);
    }

    // Inicia o scanner com prioridade para a câmera traseira
    async function iniciarScanner() {
      const resultado = document.getElementById("resultado");

      try {
        const devices = await Html5Qrcode.getCameras();

        if (!devices || devices.length === 0) {
          resultado.textContent = "Nenhuma câmera encontrada";
          resultado.style.color = "red";
          return;
        }

        // Identifica a câmera traseira
        let cameraId = devices.find(d =>
          d.label.toLowerCase().includes("back") ||
          d.label.toLowerCase().includes("rear") ||
          d.label.toLowerCase().includes("traseira")
        )?.id;

        // Se não encontrar, usa a primeira
        if (!cameraId) cameraId = devices[0].id;

        // Cria o scanner
        const scanner = new Html5Qrcode("reader");

        // Inicia
        await scanner.start(
          cameraId,
          { fps: 10, qrbox: 250 },
          onScanSuccess,
          onScanError
        );

      } catch (err) {
        console.error("Erro ao iniciar câmera:", err);
        resultado.textContent =
          "⚠️ Não foi possível acessar a câmera. Verifique permissões.";
        resultado.style.color = "red";
      }
    }

    // Start
    iniciarScanner();
  </script>

</body>
</html>
