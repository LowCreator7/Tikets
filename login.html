<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login - Samba de Férias</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
// 🔥 Config Firebase
const firebaseConfig = {
  apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
  authDomain: "sistemaingressos-a98f0.firebaseapp.com",
  projectId: "sistemaingressos-a98f0",
  storageBucket: "sistemaingressos-a98f0.firebasestorage.app",
  messagingSenderId: "1227812590",
  appId: "1:1227812590:web:07107c0e3069fe9dfbcdff",
  measurementId: "G-QGDNMN0VQ5"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
</script>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', Arial, sans-serif;
        background: linear-gradient(135deg, #0d47a1, #1565c0);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #fff;
    }

    .card {
        width: 360px;
        background: #ffffff;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        text-align: center;
        animation: fadeIn 0.6s ease;
    }

    h2 {
        margin-bottom: 10px;
        color: #0d47a1;
        font-weight: 700;
    }

    p.subtitle {
        font-size: 13px;
        color: #555;
        margin-top: -4px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #aaa;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #1565c0;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 5px;
    }

    button:hover {
        background: #0d47a1;
        transform: scale(1.03);
    }

    a {
        color: #1565c0;
        text-decoration: none;
        font-size: 14px;
        display: block;
        margin-top: 12px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
    }
</style>

</head>

<body>

<div class="card">
    <h2>Bem-vindo</h2>
    <p class="subtitle">Acesse sua área de vendas ou administração</p>

    <input id="email" placeholder="Email" />
    <input id="password" placeholder="Senha" type="password"/>

    <button id="btnLogin">Entrar</button>

    <a href="index.html">Voltar ao início</a>
</div>

<script>
// Redirecionamento automático se já estiver logado
auth.onAuthStateChanged(user => {
  if (user) {
    const email = user.email;

    if (email.endsWith("@admin.com")) {
        window.location.href = "admin.html";
    } else {
        window.location.href = "controle.html";
    }
  }
});

// Botão de login
document.getElementById("btnLogin").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();

  try {
    const userCred = await auth.signInWithEmailAndPassword(email, pass);

    // 🔍 Define destino conforme o tipo do usuário
    if (email.endsWith("@admin.com")) {
        window.location.href = "admin.html";
    } else {
        window.location.href = "controle.html";
    }

  } catch (err) {
    alert("Erro ao fazer login: " + err.message);
  }
});
</script>

</body>
</html>
