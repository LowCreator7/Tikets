<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema de Ingressos – Login</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<style>
/* ==== RESET ==== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ==== BACKGROUND ANIMADO ==== */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Inter", sans-serif;
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #283593, #1565c0);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
}

/* ==== LOGIN CARD (GLASS EFFECT) ==== */
.login-card {
    width: 340px;
    background: rgba(255, 255, 255, 0.08);
    padding: 40px 32px;
    border-radius: 18px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 35px rgba(0,0,0,0.4);
    text-align: center;
    animation: fadeIn 0.7s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ==== LOGO / TÍTULO ==== */
.login-card h2 {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 20px;
}

/* ==== INPUTS ==== */
input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    margin-bottom: 14px;
    font-size: 16px;
}

input:focus {
    outline: 2px solid #64b5f6;
    background: #eef6ff;
}

/* ==== BOTÃO ==== */
button {
    width: 100%;
    padding: 14px;
    margin-top: 4px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    background: linear-gradient(135deg, #42a5f5, #1e88e5);
    color: white;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.03);
    background: linear-gradient(135deg, #64b5f6, #2196f3);
}

/* ==== ERRO ==== */
.error-box {
    margin-top: 14px;
    padding: 12px;
    background: #e53935;
    border-radius: 10px;
    display: none;
    color: white;
    font-size: 14px;
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* LOADING BUTTON */
.loading {
    opacity: 0.7;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="login-card">
    <h2>Bem-vindo</h2>

    <input id="email" type="email" placeholder="E-mail" />
    <input id="senha" type="password" placeholder="Senha" />

    <button id="btnLogin" onclick="login()">Entrar</button>

    <div id="erro" class="error-box"></div>
</div>

<script>
// ========== FIREBASE ==========
const firebaseConfig = {
    apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
    authDomain: "sistemaingressos-a98f0.firebaseapp.com",
    projectId: "sistemaingressos-a98f0",
    storageBucket: "sistemaingressos-a98f0.firebasestorage.app",
    messagingSenderId: "1227812590",
    appId: "1:1227812590:web:07107c0e3069fe9dfbcdff"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ========== LOGIN ==========
function login() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const erro = document.getElementById("erro");
    const btn = document.getElementById("btnLogin");

    erro.style.display = "none";

    if (!email || !senha) {
        showError("Preencha todos os campos.");
        return;
    }

    btn.classList.add("loading");
    btn.innerText = "Carregando...";

    auth.signInWithEmailAndPassword(email, senha)
        .then((cred) => {
            const mail = cred.user.email;

            if (mail.endsWith("@admin.com")) {
                window.location.href = "admin.html";
            } else if (mail.endsWith("@staff.com")) {
                window.location.href = "painel.html";
            } else {
                showError("Este e-mail não tem permissão.");
                auth.signOut();
            }
        })
        .catch((err) => {
            showError(traduzErro(err.code));
        })
        .finally(() => {
            btn.classList.remove("loading");
            btn.innerText = "Entrar";
        });
}

// ========== MENSAGENS ==========
function showError(msg) {
    const erro = document.getElementById("erro");
    erro.innerHTML = msg;
    erro.style.display = "block";
}

function traduzErro(code) {
    switch(code) {
        case "auth/user-not-found": return "Usuário não encontrado.";
        case "auth/wrong-password": return "Senha incorreta.";
        case "auth/invalid-email": return "E-mail inválido.";
        case "auth/too-many-requests": return "Muitas tentativas. Tente mais tarde.";
        default: return "Erro ao fazer login.";
    }
}
</script>

</body>
</html>
