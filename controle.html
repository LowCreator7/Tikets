<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="firebase.js"></script>
<style>
/* --- CSS mantém igual ao seu anterior --- */
:root{
  --blue-900:#0d47a1;
  --blue-700:#1565c0;
  --muted:#64748b;
  --success:#2e7d32;
  --danger:#c62828;
  --radius:14px;
  --card-bg:#fff;
  --page-bg:#f4f7fb;
}
body{
  margin:0;
  background:var(--page-bg);
  font-family:Inter, system-ui, sans-serif;
  padding:20px;
  color:#0f1724;
}
.wrap{
  max-width:1150px;
  margin:auto;
}
h1{margin:0 0 20px 0;color:var(--blue-900);font-size:26px;font-weight:800;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
a.back{color:var(--blue-700);text-decoration:none;font-size:14px;font-weight:600;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px;}
.stat{background:var(--card-bg);padding:18px;border-radius:var(--radius);box-shadow:0 6px 18px rgba(13,71,161,0.05);text-align:center;}
.stat h2{margin:0;font-size:26px;color:var(--blue-700);}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--muted);}
.table-wrap{background:white;border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 18px rgba(13,71,161,0.05);}
table{width:100%;border-collapse:collapse;font-size:14px;}
thead{background:#eef4ff;color:var(--blue-900);}
th,td{padding:14px;text-align:left;}
tbody tr{border-bottom:1px solid #f1f5f9;}
tbody tr:hover{background:#f8fbff;}
.status{padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px;text-transform:capitalize;}
.status.usado{ background:#e8f5e9; color:var(--success);}
.status.pendente{ background:#fff3e0; color:#b45309;}
.btn{padding:10px 18px;background:var(--blue-700);color:white;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;margin-top:20px;}
.search-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;}
.search-input{flex:1;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;}
@media(max-width:720px){.stats{ grid-template-columns:1fr; } th,td{ font-size:13px; }}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>Painel de Controle</h1>
    <a href="index.html" class="back">⬅ voltar</a>
  </div>

  <div class="stats">
    <div class="stat"><h2 id="sTotal">0</h2><span>Total de ingressos</span></div>
    <div class="stat"><h2 id="sPaid">0</h2><span>Pagos</span></div>
    <div class="stat"><h2 id="sSent">0</h2><span>Enviados</span></div>
  </div>

  <div class="search-bar">
    <input id="searchInput" class="search-input" type="text" placeholder="Buscar por ID ou Cliente...">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"><tr><td colspan="4" style="text-align:center;color:#64748b;padding:20px;">Carregando...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
auth.onAuthStateChanged(user => {
  if (!user) window.location.href = "login.html";

  // realtime apenas ingressos do vendedor
  db.collection("ingressos").where("vendedorId","==",user.uid)
    .onSnapshot(snapshot => {
      const ingressos = [];
      snapshot.forEach(doc => ingressos.push({ id: doc.id, ...doc.data() }));
      atualizarStats(ingressos);
      renderTabela(ingressos);
    });
});

function atualizarStats(ingressos){
  document.getElementById("sTotal").textContent = ingressos.length;
  const pagos = ingressos.filter(i=>i.status==="pago").length;
  const enviados = ingressos.filter(i=>i.status==="enviado").length;
  document.getElementById("sPaid").textContent = pagos;
  document.getElementById("sSent").textContent = enviados;
}

function renderTabela(ingressos){
  const body = document.getElementById("tableBody");
  const search = document.getElementById("searchInput").value.toLowerCase();
  body.innerHTML = "";

  const filtered = ingressos.filter(i =>
    i.id.toLowerCase().includes(search) || i.cliente.nome.toLowerCase().includes(search)
  );

  if(filtered.length===0){
    body.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:20px;color:#64748b;">Nenhum ingresso encontrado</td></tr>`;
    return;
  }

  filtered.forEach(i=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i.id}</td>
      <td>${i.cliente.nome}</td>
      <td><span class="status ${i.status}">${i.status}</span></td>
      <td>
        ${i.status==="pendente"? `<button onclick="atualizarStatus('${i.id}','pago')">Pago</button>` : ""}
        ${i.status==="pago"? `<button onclick="atualizarStatus('${i.id}','enviado')">Enviado</button>` : ""}
      </td>
    `;
    body.appendChild(tr);
  });
}

function atualizarStatus(id, novoStatus){
  db.collection("ingressos").doc(id).update({ status: novoStatus })
    .then(()=>alert(`Status do ingresso ${id} atualizado para ${novoStatus}`))
    .catch(e=>alert("Erro: "+e));
}

document.getElementById("searchInput").addEventListener("input",()=>{
  const user = auth.currentUser;
  if(!user) return;
  db.collection("ingressos").where("vendedorId","==",user.uid)
    .get()
    .then(snapshot=>{
      const ingressos = [];
      snapshot.forEach(doc => ingressos.push({ id: doc.id, ...doc.data() }));
      renderTabela(ingressos);
    });
});
</script>
</body>
</html>
