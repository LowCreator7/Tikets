<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Painel de Ingressos</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<!-- QRCode -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// =============== CONFIG FIREBASE ===============
const firebaseConfig = {
    apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
    authDomain: "sistemaingressos-a98f0.firebaseapp.com",
    projectId: "sistemaingressos-a98f0",
    storageBucket: "sistemaingressos-a98f0.firebasestorage.app",
    messagingSenderId: "1227812590",
    appId: "1:1227812590:web:07107c0e3069fe9dfbcdff",
    measurementId: "G-QGDNMN0VQ5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Proteção
auth.onAuthStateChanged(user => {
    if (!user) window.location.href = "login.html";
});
</script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    padding: 20px;
    color: #0d47a1;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 5px #0002;
}

.btn {
    padding: 8px;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    margin-right: 6px;
}

.pago { background: #2e7d32; }
.enviado { background: #1565c0; }
.pendente { background: #e65100; }
</style>

</head>
<body>

<h2>Painel de Ingressos</h2>
<a href="index.html">⬅ Voltar</a>

<h3>Filtros</h3>
<button class="btn pendente" onclick="setFiltro('todos')">Todos</button>
<button class="btn pendente" onclick="setFiltro('pendente')">Pendentes</button>
<button class="btn pago" onclick="setFiltro('pago')">Pagos</button>
<button class="btn enviado" onclick="setFiltro('enviado')">Enviados</button>

<div id="lista" style="margin-top:20px;"></div>

<script>
let filtroAtual = "todos";

function setFiltro(f){
    filtroAtual = f;
    render();
}

// =============== CARREGAR EM TEMPO REAL ===============
let ingressos = [];

db.collection("ingressos")
  .orderBy("geradoEm", "desc")
  .onSnapshot(snapshot => {
        ingressos = [];
        snapshot.forEach(doc => ingressos.push(doc.data()));
        render();
  });

// =============== ATUALIZA STATUS ===============
function marcarPago(id){
    db.collection("ingressos").doc(id).update({
        statusPagamento: "pago"
    });
}

function marcarEnviado(id){
    db.collection("ingressos").doc(id).update({
        statusEnvio: "enviado"
    });
}

// =============== RENDERIZAÇÃO ===============
function render(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    let filtrados = ingressos;

    if (filtroAtual !== "todos"){
        filtrados = ingressos.filter(i => 
            i.statusPagamento === filtroAtual || i.statusEnvio === filtroAtual
        );
    }

    if (filtrados.length === 0){
        lista.innerHTML = "<p>Nenhum ingresso encontrado.</p>";
        return;
    }

    filtrados.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <b>ID: </b> ${item.id}<br>
            <b>Evento:</b> ${item.evento}<br>
            <b>Pagamento:</b> ${item.statusPagamento}<br>
            <b>Envio:</b> ${item.statusEnvio}<br><br>
            <div id="qr-${item.id}"></div>
            <br>

            <button class="btn pago" onclick="marcarPago('${item.id}')">Marcar como Pago</button>
            <button class="btn enviado" onclick="marcarEnviado('${item.id}')">Marcar como Enviado</button>
        `;

        lista.appendChild(card);

        // gera QR
        new QRCode(document.getElementById("qr-"+item.id), {
            text: item.id,
            width: 110,
            height: 110
        });
    });

}
</script>

</body>
</html>
