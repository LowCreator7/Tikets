<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Painel de Ingressos</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<!-- QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    margin: 0;
    background: #eef3fb;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1a237e;
}

/* ---------- HEADER ---------- */
.header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 22px;
    color: white;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header a {
    color: #bbdefb;
    text-decoration: none;
    font-size: 15px;
}

/* ---------- CONTAINER ---------- */
.container {
    padding: 24px;
    max-width: 900px;
    margin: auto;
}

/* ---------- FILTROS ---------- */
.filters {
    margin-bottom: 20px;
}

.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: 500;
    margin-right: 8px;
    transition: 0.2s;
}

.btn:hover {
    opacity: 0.8;
}

.btn-all { background: #455a64; }
.btn-pendente { background: #ef6c00; }
.btn-pago { background: #2e7d32; }
.btn-enviado { background: #1565c0; }

/* ---------- CARD ---------- */
.card {
    background: white;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 3px 10px #0002;
    margin-bottom: 20px;
    transition: 0.25s;
}

.card:hover {
    transform: scale(1.01);
}

/* ---------- STATUS BADGE ---------- */
.badge {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
    display: inline-block;
    margin-right: 8px;
    font-weight: 600;
    color: white;
}

.bg-pendente { background: #ef6c00; }
.bg-pago { background: #2e7d32; }
.bg-enviado { background: #1565c0; }

/* QR Code container */
.qr-box {
    width: 120px;
    height: 120px;
    padding: 10px;
    background: #e3f2fd;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 12px;
    margin-bottom: 12px;
}

/* Action buttons */
.action-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    margin-right: 6px;
    cursor: pointer;
    color: white;
    font-weight: 500;
}

.action-pago { background: #2e7d32; }
.action-enviado { background: #1565c0; }

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    Painel de Ingressos
    <a href="index.html">⬅ Voltar</a>
    <a href="#" onclick="logout()">Sair</a>
</div>

<div class="container">

    <!-- FILTROS -->
    <div class="filters">
        <button class="btn btn-all" onclick="setFiltro('todos')">Todos</button>
        <button class="btn btn-pendente" onclick="setFiltro('pendente')">Pendentes</button>
        <button class="btn btn-pago" onclick="setFiltro('pago')">Pagos</button>
        <button class="btn btn-enviado" onclick="setFiltro('enviado')">Enviados</button>
    </div>

    <div id="lista"></div>

</div>

<script>
// ================= FIREBASE ==================
const firebaseConfig = {
    apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
    authDomain: "sistemaingressos-a98f0.firebaseapp.com",
    projectId: "sistemaingressos-a98f0",
    storageBucket: "sistemaingressos-a98f0.firebasestorage.app",
    messagingSenderId: "1227812590",
    appId: "1:1227812590:web:07107c0e3069fe9dfbcdff",
    measurementId: "G-QGDNMN0VQ5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let filtroAtual = "todos";
let ingressos = [];

// ================= PROTEÇÃO + CARREGAMENTO ==================
auth.onAuthStateChanged(user => {
    if (!user) return window.location.href = "login.html";

    // 🔒 Impede ADMIN de acessar painel de vendedor
    if (user.email.endsWith("@admin.com")) {
        alert("Administradores usam outro painel.");
        return window.location.href = "admin.html";
    }

    // 🔥 SOMENTE INGRESSOS DO VENDEDOR
    db.collection("ingressos")
      .where("vendedorUid", "==", user.uid)
      .orderBy("geradoEm", "desc")
      .onSnapshot(snapshot => {
            ingressos = [];
            snapshot.forEach(doc => ingressos.push(doc.data()));
            render();
      });
});

// ================= FILTROS ==================
function setFiltro(f) {
    filtroAtual = f;
    render();
}

// ================= ATUALIZAR STATUS ==================
function marcarPago(id){
    db.collection("ingressos").doc(id).update({
        statusPagamento: "pago"
    });
}

function marcarEnviado(id){
    db.collection("ingressos").doc(id).update({
        statusEnvio: "enviado"
    });
}

// ================= LOGOUT ==================
function logout() {
    auth.signOut();
    location.href = "login.html";
}

// ================= RENDER ==================
function render(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    let filtrados = ingressos;

    // Filtros corrigidos
    if (filtroAtual === "pendente") {
        filtrados = ingressos.filter(i => i.statusPagamento === "pendente");
    }
    else if (filtroAtual === "pago") {
        filtrados = ingressos.filter(i => i.statusPagamento === "pago");
    }
    else if (filtroAtual === "enviado") {
        filtrados = ingressos.filter(i => i.statusEnvio === "enviado");
    }

    filtrados.forEach(item => {

        // Corrige IDs seguros para DOM
        const safeId = item.id.replace(/[^a-zA-Z0-9_-]/g, "");

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div style="font-size:18px;font-weight:bold;color:#1e3c72">
                🎟 ${item.id}
            </div>

            <div><b>Cliente:</b> ${item.nome}</div>
            <div><b>Evento:</b> ${item.evento}</div>

            <div style="margin-top:10px;">
                <span class="badge bg-${item.statusPagamento}">
                    Pagamento: ${item.statusPagamento}
                </span>
                <span class="badge bg-${item.statusEnvio}">
                    Envio: ${item.statusEnvio}
                </span>
            </div>

            <div class="qr-box" id="qr-${safeId}"></div>

            <button class="action-btn action-pago" onclick="marcarPago('${item.id}')">
                ✔ Marcar como Pago
            </button>

            <button class="action-btn action-enviado" onclick="marcarEnviado('${item.id}')">
                ✉ Marcar como Enviado
            </button>
        `;

        lista.appendChild(card);

        // QR Code corrigido (sem duplicar)
        const box = document.getElementById("qr-" + safeId);
        box.innerHTML = "";

        new QRCode(box, {
            text: item.id,
            width: 100,
            height: 100
        });
    });
}
</script>

</body>
</html>
