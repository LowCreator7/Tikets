<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Ingressos</title>

    <!-- Estilos gerais -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 420px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 25px;
            font-weight: 600;
        }

        label {
            font-weight: 500;
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #334155;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            background: #f8fafc;
            transition: 0.2s;
        }

        select:focus, input:focus {
            border-color: #0ea5e9;
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #0ea5e9;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #0284c7;
        }

        .back-btn {
            margin-top: 12px;
            background: #475569;
        }

        .back-btn:hover {
            background: #334155;
        }

        .msg {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Gerar Ingressos</h2>

        <label for="template">Template:</label>
        <select id="template">
            <option value="">Selecione</option>
            <option value="template1">Template 1</option>
            <option value="template2">Template 2</option>
        </select>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" placeholder="Ex: 3">

        <button id="btnGerar">Gerar Ingressos</button>

        <button class="back-btn" onclick="window.location.href='painel.html'">
            Voltar ao Painel
        </button>

        <div id="mensagem" class="msg"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const btn = document.getElementById("btnGerar");
    const msg = document.getElementById("mensagem");

    btn.addEventListener("click", async () => {
        const template = document.getElementById("template").value;
        const quantidade = Number(document.getElementById("quantidade").value);

        msg.innerHTML = "";

        if (!template || quantidade <= 0) {
            msg.innerHTML = "<span class='error'>Preencha todos os campos.</span>";
            return;
        }

        try {
            for (let i = 0; i < quantidade; i++) {
                await addDoc(collection(db, "ingressos"), {
                    template: template,
                    criadoEm: serverTimestamp(),
                    enviado: false,
                    pago: false
                });
            }

            msg.innerHTML = "<span class='success'>Ingressos gerados com sucesso!</span>";

        } catch (e) {
            msg.innerHTML = "<span class='error'>Erro ao gerar: " + e.message + "</span>";
        }
    });
</script>

</body>
</html>
