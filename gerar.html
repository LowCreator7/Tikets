<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerar Ingressos</title>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- QRious -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<!-- Estilo -->
<style>
    body { margin:0; background:#F3F4F6; font-family:Arial, sans-serif; color:#111827; }
    .container {
        max-width:750px; margin:40px auto; padding:25px; background:white;
        border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }
    h2 { margin-top:0; color:#1F2937; font-weight:700; }
    .voltar {
        text-decoration:none; color:#2563EB; font-weight:600;
        margin-bottom:15px; display:inline-block;
    }
    label { display:block; margin-top:15px; font-weight:600; }
    input, select {
        width:100%; padding:10px; margin-top:6px;
        border:1px solid #D1D5DB; border-radius:6px;
    }
    button {
        margin-top:20px; width:100%; padding:12px;
        border:none; background:#2563EB; color:white;
        font-weight:bold; font-size:16px; border-radius:8px; cursor:pointer;
    }
    button:hover { background:#1E40AF; }
    .msg { display:none; margin-top:20px; padding:12px; border-radius:8px; font-weight:bold; }
    .success { background:#D1FAE5; color:#065F46; }
    .error { background:#FEE2E2; color:#991B1B; }
</style>
</head>

<body>

<div class="container">

    <a class="voltar" href="index.html">⬅ Voltar</a>

    <h2>Gerar Ingressos</h2>

    <label>Template</label>
    <select id="template">
        <option value="template">Template principal</option>
    </select>

    <label>Quantidade</label>
    <input id="quantidade" type="number" value="1" min="1">

    <button id="btnGerar">Gerar Ingressos</button>

    <div id="mensagem" class="msg"></div>

</div>

<script>
// ---------------- Config Firebase ----------------
const firebaseConfig = {
    apiKey: "AIzaSyD4Mwgq2qmjZ33VVR7RUFjZViUXJ3Ijpgk",
    authDomain: "sistemaingressos-a98f0.firebaseapp.com",
    projectId: "sistemaingressos-a98f0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// --------- Função para formatar data estilo "18 de novembro de 2025 às 15:43:03 UTC-3" ---------
function formatarDataCompleta() {
    const agora = new Date();
    return agora.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        timeZone: "America/Sao_Paulo"
    }) + " UTC-3";
}

// --------- ID estilo: SAMBADF-XXXXXXX ---------
function gerarIdIngresso() {
    const prefixo = "SAMBADF-";
    const random = Math.random().toString(36).substring(2, 10).toUpperCase();
    return prefixo + random;
}


// -------------- Função gerar -----------------
document.getElementById("btnGerar").addEventListener("click", async () => {

    const msg = document.getElementById("mensagem");
    msg.style.display = "none";

    const template = document.getElementById("template").value;
    const qtd = Number(document.getElementById("quantidade").value);

    if (qtd <= 0) {
        msg.textContent = "Quantidade inválida.";
        msg.className = "msg error";
        msg.style.display = "block";
        return;
    }

    try {

        for (let i = 0; i < qtd; i++) {

            const ingressoId = gerarIdIngresso();
            const dataGerada = formatarDataCompleta();

            // Criar QR code
            const qrCanvas = document.createElement("canvas");
            new QRious({
                element: qrCanvas,
                value: ingressoId,
                size: 500
            });

            // Carrega o template fixo
            const templateImg = new Image();
            templateImg.src = `templates/${template}.png`;

            await new Promise(resolve => templateImg.onload = resolve);

            // Canvas final
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = templateImg.width;
            canvas.height = templateImg.height;

            // Desenha template
            ctx.drawImage(templateImg, 0, 0);

            // QR centralizado
            const qrSize = 350;

            ctx.drawImage(
                qrCanvas,
                (canvas.width / 2) - (qrSize / 2),
                (canvas.height / 2) - (qrSize / 2),
                qrSize,
                qrSize
            );

            // Baixar PNG automaticamente
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = `${ingressoId}.png`;
            link.click();

            // ----------- Salvar no Firestore NO NOVO PADRÃO -------------
            await db.collection("ingressos").add({
                id: ingressoId,
                evento: "Samba de Férias",
                geradoEm: dataGerada,
                statusEnvio: "pendente",
                statusPagamento: "pendente",
                template: template
            });

        }

        msg.textContent = "Ingressos gerados e salvos no sistema!";
        msg.className = "msg success";
        msg.style.display = "block";

    } catch (err) {
        msg.textContent = "Erro: " + err.message;
        msg.className = "msg error";
        msg.style.display = "block";
    }

});
</script>

</body>
</html>
