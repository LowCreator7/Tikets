<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Samba de Férias - Sistema de Ingressos</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d47a1;
        color: white;
        text-align: center;
        padding: 40px 20px;
    }

    h1 {
        font-size: 2.2rem;
        margin-bottom: 10px;
    }

    p { opacity: 0.9; }

    .btn {
        display: block;
        width: 250px;
        margin: 20px auto;
        padding: 15px;
        background: white;
        color: #0d47a1;
        font-weight: bold;
        text-decoration: none;
        border-radius: 10px;
        font-size: 1.1rem;
        box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        transition: 0.2s;
    }

    .btn:hover {
        transform: scale(1.05);
    }

    .box {
        background: rgba(255,255,255,0.12);
        padding: 20px;
        border-radius: 12px;
        margin-top: 30px;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
        backdrop-filter: blur(4px);
    }
</style>
</head>
<body>

<h1>Samba de Férias</h1>
<p>Sistema simples para controle e validação de ingressos digitais.</p>

<div class="box">
    <a class="btn" href="gerar.html">Gerar Ingressos</a>
    <a class="btn" href="login.html">Área Administrativa (Login)</a>
    <a class="btn" href="controle.html">Listar Ingressos</a>
    <a class="btn" href="validador.html">Validar Ingressos</a>
</div>

</body>
</html>
